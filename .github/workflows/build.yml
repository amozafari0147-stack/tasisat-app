name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Flutter Project & Inject Code
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.tasisat .
          flutter pub add sqflite path flutter_localizations intl
          cp ../lib/main.dart lib/main.dart
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk ../tasisat_app.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tasisat-app-release
          path: tasisat_app.apk
