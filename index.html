<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM PARSA MEHR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        industrial: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            600: '#475569',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-industrial-100 text-industrial-900 min-h-screen flex flex-col">

    <!-- هدر صنعتی با عنوان پارسا مهر آرین -->
    <header class="bg-industrial-900 text-white shadow-md border-b-4 border-amber-500 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-amber-500 text-industrial-900 p-2 rounded-lg font-black text-xl shadow">
                    <i class="fa-solid fa-industry"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-black tracking-wider text-amber-400">پارسا مهر آرین</h1>
                    <p class="text-xs text-gray-300">سامانه جامع مدیریت تأسیسات و نت (CMMS)</p>
                </div>
            </div>
            <div id="header-user-info" class="hidden flex items-center space-x-2 space-x-reverse text-sm">
                <span id="current-username" class="font-medium text-gray-200"></span>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs transition">خروج</button>
            </div>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-4xl">
        
        <!-- بخش احراز هویت (ورود / ثبت‌نام) -->
        <section id="auth-section" class="bg-white rounded-xl shadow-lg p-6 border border-gray-200">
            <div class="max-w-md mx-auto">
                <div class="flex border-b mb-6">
                    <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 font-bold text-center border-b-2 border-industrial-800 text-industrial-800">ورود به سامانه</button>
                    <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 font-medium text-center text-gray-500">ثبت‌نام پرسنل</button>
                </div>

                <!-- فرم ورود -->
                <div id="form-login" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">شماره موبایل</label>
                        <input type="tel" id="login-mobile" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-industrial-800 focus:outline-none" placeholder="09123456789">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">رمز عبور</label>
                        <input type="password" id="login-password" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-industrial-800 focus:outline-none" placeholder="رمز عبور">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-industrial-900 text-white py-2 rounded-lg font-bold hover:bg-industrial-800 transition">ورود</button>
                    
                    <div class="pt-2 border-t mt-4">
                        <button onclick="fillAdminLogin()" class="w-full bg-amber-500 text-industrial-900 py-2 rounded-lg font-bold text-sm hover:bg-amber-400 transition flex items-center justify-center space-x-2 space-x-reverse">
                            <i class="fa-solid fa-user-shield"></i>
                            <span>ورود سریع مدیر سیستم (تایید پرسنل)</span>
                        </button>
                    </div>

                    <div class="text-left">
                        <button onclick="showForgotPassword()" class="text-xs text-blue-600 hover:underline">فراموشی رمز عبور؟</button>
                    </div>
                </div>

                <!-- فرم ثبت‌نام -->
                <div id="form-register" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium mb-1">نام و نام خانوادگی</label>
                        <input type="text" id="reg-name" class="w-full px-3 py-2 border rounded-lg focus:outline-none" placeholder="مثال: علی رضایی">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">سمت سازمانی</label>
                        <input type="text" id="reg-position" class="w-full px-3 py-2 border rounded-lg focus:outline-none" placeholder="مثال: اپراتور / تکنسین تأسیسات">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">شماره موبایل</label>
                        <input type="tel" id="reg-mobile" class="w-full px-3 py-2 border rounded-lg focus:outline-none" placeholder="09123456789">
                    </div>
                    <button onclick="handleRegister()" class="w-full bg-amber-500 text-industrial-900 py-2 rounded-lg font-bold hover:bg-amber-400 transition">ثبت‌نام و ارسال کد تایید</button>
                </div>

                <!-- فرم تایید OTP -->
                <div id="form-otp" class="space-y-4 hidden">
                    <p class="text-sm text-gray-600 text-center">کد تایید ارسال شده را وارد کنید:</p>
                    <div>
                        <input type="text" id="otp-code" class="w-full text-center tracking-widest text-lg px-3 py-2 border rounded-lg focus:outline-none" placeholder="----">
                    </div>
                    <button onclick="verifyOtp()" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700 transition">تایید و ثبت نهایی</button>
                </div>

            </div>
        </section>

        <!-- پنل اصلی کاربری / مدیریت -->
        <section id="dashboard-section" class="hidden space-y-6">
            <div id="admin-panel" class="hidden bg-white rounded-xl shadow-lg p-6 border border-amber-300">
                <h3 class="text-lg font-bold text-amber-600 mb-4 border-b pb-2"><i class="fa-solid fa-user-shield ml-2"></i>مدیریت دسترسی پرسنل و تأیید ثبت‌نام‌ها</h3>
                <div id="pending-users-list" class="space-y-2">
                    <!-- لیست کاربران در انتظار تایید -->
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-200">
                <h3 class="text-lg font-bold text-industrial-900 mb-2">خوش آمدید!</h3>
                <p class="text-gray-600 text-sm">سامانه آماده بهره‌برداری و مدیریت تجهیزات کارخانه پارسا مهر آرین است.</p>
            </div>
        </section>

    </main>

    <!-- فوتر -->
    <footer class="bg-industrial-900 text-gray-400 text-center py-4 text-xs mt-auto">
        <p>کلیه حقوق برای شرکت پارسا مهر آرین محفوظ است © ۱۴۰۵</p>
    </footer>

    <!-- کدهای منطق جاوااسکریپت -->
    <script>
        let users = JSON.parse(localStorage.getItem('parsammehr_users')) || [
            { name: 'مدیر سیستم', position: 'مدیر کل', mobile: '09120000000', pass: '1368', role: 'admin', status: 'approved' }
        ];
        let currentUser = null;

        function switchTab(tab) {
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
            document.getElementById('tab-login').className = tab === 'login' ? 'flex-1 py-2 font-bold text-center border-b-2 border-industrial-800 text-industrial-800' : 'flex-1 py-2 font-medium text-center text-gray-500';
            document.getElementById('tab-register').className = tab === 'register' ? 'flex-1 py-2 font-bold text-center border-b-2 border-industrial-800 text-industrial-800' : 'flex-1 py-2 font-medium text-center text-gray-500';
        }

        function fillAdminLogin() {
            document.getElementById('login-mobile').value = '09120000000';
            document.getElementById('login-password').value = '1368';
        }

        function handleLogin() {
            const mobile = document.getElementById('login-mobile').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if (mobile === '09120000000' && pass === '1368') {
                currentUser = users.find(u => u.mobile === '09120000000') || { name: 'مدیر کل', role: 'admin', position: 'مدیر تأسیسات' };
                initDashboard();
                return;
            }

            const user = users.find(u => u.mobile === mobile && u.pass === pass);
            if (!user) {
                alert('اطلاعات ورود اشتباه است یا کاربر یافت نشد.');
                return;
            }
            if (user.status !== 'approved') {
                alert('حساب کاربری شما هنوز توسط مدیر تایید نشده است.');
                return;
            }

            currentUser = user;
            initDashboard();
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const position = document.getElementById('reg-position').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();

            if (!name || !position || !mobile) {
                alert('لطفاً تمامی فیلدها را به دقت پر کنید.');
                return;
            }

            alert('کد تایید (OTP) فرضی: 1234');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById('form-otp').classList.remove('hidden');
            
            window.tempRegUser = { name, position, mobile, status: 'pending', role: 'user', pass: '1234' };
        }

        function verifyOtp() {
            const code = document.getElementById('otp-code').value.trim();
            if (code === '1234' && window.tempRegUser) {
                users.push(window.tempRegUser);
                localStorage.setItem('parsammehr_users', JSON.stringify(users));
                alert('ثبت‌نام شما با موفقیت انجام شد. پس از تایید مدیریت قادر به ورود خواهید بود.');
                location.reload();
            } else {
                alert('کد تایید اشتباه است.');
            }
        }

        function initDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('header-user-info').classList.remove('hidden');
            document.getElementById('current-username').innerText = currentUser.name + ' (' + currentUser.position + ')';

            if (currentUser.role === 'admin') {
                document.getElementById('admin-panel').classList.remove('hidden');
                renderPendingUsers();
            }
        }

        function renderPendingUsers() {
            const container = document.getElementById('pending-users-list');
            const pending = users.filter(u => u.status === 'pending');
            if (pending.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500">کاربر در انتظار تاییدی وجود ندارد.</p>';
                return;
            }
            container.innerHTML = pending.map((u, idx) => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded border">
                    <div>
                        <p class="font-bold text-sm">${u.name} - <span class="text-xs text-gray-600">${u.position}</span></p>
                        <p class="text-xs text-gray-500">موبایل: ${u.mobile}</p>
                    </div>
                    <button onclick="approveUser('${u.mobile}')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs">تایید دسترسی</button>
                </div>
            `).join('');
        }

        function approveUser(mobile) {
            const user = users.find(u => u.mobile === mobile);
            if (user) {
                user.status = 'approved';
                localStorage.setItem('parsammehr_users', JSON.stringify(users));
                renderPendingUsers();
                alert('دسترسی کاربر تایید شد.');
            }
        }

        function logout() {
            currentUser = null;
            location.reload();
        }

        function showForgotPassword() {
            const mobile = prompt('شماره موبایل خود را وارد کنید تا کد جدید ارسال شود:');
            if (mobile) {
                alert('کد بازیابی موقت (رمز عبور جدید شما): 1368\nمی‌توانید با این رمز وارد شوید.');
            }
        }
    </script>
</body>
</html>
