<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت تأسیسات و نت - پارسا مهر آرین</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- هدر شیک و صنعتی (بدون تغییر ساختار و رنگ) -->
    <header class="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 border-b border-slate-800 shadow-2xl py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-8 bg-amber-500 rounded-full shadow-lg shadow-amber-500/50"></div>
            <div>
                <h1 class="text-xl md:text-2xl font-black tracking-wider text-amber-400 drop-shadow">PM PARSA MEHR</h1>
                <p class="text-xs text-slate-400 font-medium">سیستم جامع مدیریت تأسیسات و نت (پارسا مهر آرین)</p>
            </div>
        </div>
        <div id="header-user-info" class="hidden flex items-center gap-4">
            <span id="current-user-badge" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-amber-300"></span>
            <button onclick="logout()" class="bg-rose-900/50 hover:bg-rose-900 text-rose-200 border border-rose-700/50 px-3 py-1.5 rounded-lg text-xs transition">خروج</button>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="flex-grow p-4 md:p-6 max-w-6xl mx-auto w-full">

        <!-- صفحه احراز هویت (ورود) -->
        <section id="auth-section" class="max-w-md mx-auto mt-10 bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-6 shadow-2xl">
            <div class="flex border-b border-slate-700 mb-6">
                <button onclick="switchTab('staff')" id="tab-staff-btn" class="flex-1 pb-3 font-bold text-amber-400 border-b-2 border-amber-400 transition">ورود پرسنل</button>
                <button onclick="switchTab('manager')" id="tab-manager-btn" class="flex-1 pb-3 font-bold text-slate-400 transition">ورود مدیر</button>
            </div>

            <!-- فرم پرسنل -->
            <form id="staff-form" onsubmit="handleStaffLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">نام و نام خانوادگی</label>
                    <input type="text" id="staff-name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">سمت</label>
                    <input type="text" id="staff-role" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">شماره موبایل</label>
                    <input type="tel" id="staff-phone" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500" dir="ltr">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/20">ورود / ثبت‌نام در سیستم</button>
            </form>

            <!-- فرم مدیر -->
            <form id="manager-form" onsubmit="handleManagerLogin(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">رمز عبور مدیریت</label>
                    <input type="password" id="manager-pass" required placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500 text-center tracking-widest text-lg" dir="ltr">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/20">ورود مدیریتی</button>
            </form>
        </section>

        <!-- داشبورد اصلی (پس از ورود) -->
        <section id="dashboard-section" class="hidden space-y-6">
            <!-- نوار نوتیفیکیشن -->
            <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="w-2.5 h-2.5 bg-amber-500 rounded-full animate-ping"></span>
                    <p class="text-xs md:text-sm text-amber-200" id="latest-notification">سیستم آماده به کار است.</p>
                </div>
                <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-1 rounded">مرکز اعلان‌ها</span>
            </div>

            <!-- تب‌های داشبورد -->
            <div id="dashboard-tabs" class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <button onclick="switchDashboardTab('equipment')" class="bg-slate-800 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-xl text-center transition">
                    <div class="text-amber-400 font-bold text-lg mb-1">⚙️</div>
                    <div class="text-sm font-bold">تعریف تجهیزات</div>
                </button>
                <button onclick="switchDashboardTab('list')" class="bg-slate-800 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-xl text-center transition">
                    <div class="text-amber-400 font-bold text-lg mb-1">📋</div>
                    <div class="text-sm font-bold">لیست تجهیزات</div>
                </button>
                <button onclick="switchDashboardTab('pm')" class="bg-slate-800 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-xl text-center transition">
                    <div class="text-amber-400 font-bold text-lg mb-1">🔧</div>
                    <div class="text-sm font-bold">بخش PM و تعمیرات</div>
                </button>
                <button onclick="switchDashboardTab('scanner')" class="bg-slate-800 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-xl text-center transition">
                    <div class="text-amber-400 font-bold text-lg mb-1">📷</div>
                    <div class="text-sm font-bold">اسکنر بارکد</div>
                </button>
                <button id="manager-tab-btn" onclick="switchDashboardTab('users')" class="hidden bg-slate-800 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-xl text-center transition">
                    <div class="text-amber-400 font-bold text-lg mb-1">👥</div>
                    <div class="text-sm font-bold">مدیریت کاربران</div>
                </button>
            </div>

            <!-- محتوای بخش‌ها -->
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6">
                
                <!-- ۱. تعریف تجهیزات -->
                <div id="panel-equipment" class="dashboard-panel space-y-4">
                    <h3 class="text-base font-bold text-amber-400 border-b border-slate-700 pb-2">ثبت و تعریف دستگاه جدید</h3>
                    <form onsubmit="saveEquipment(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">نام دستگاه</label>
                            <input type="text" id="eq-name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">کد / بارکد دستگاه</label>
                            <input type="text" id="eq-code" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm" dir="ltr">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">موقعیت / سالن</label>
                            <input type="text" id="eq-location" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">دوره سرویس (روز)</label>
                            <input type="number" id="eq-period" value="30" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm" dir="ltr">
                        </div>
                        <div class="md:col-span-2">
                            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl transition">ثبت تجهیز در سیستم</button>
                        </div>
                    </form>
                </div>

                <!-- ۲. لیست تجهیزات -->
                <div id="panel-list" class="dashboard-panel space-y-4 hidden">
                    <h3 class="text-base font-bold text-amber-400 border-b border-slate-700 pb-2">لیست تجهیزات کارخانه</h3>
                    <div id="equipment-list-container" class="space-y-2"></div>
                </div>

                <!-- ۳. بخش PM و تعمیرات -->
                <div id="panel-pm" class="dashboard-panel space-y-4 hidden">
                    <h3 class="text-base font-bold text-amber-400 border-b border-slate-700 pb-2">ثبت فعالیت نت (PM) و تعمیرات</h3>
                    <form onsubmit="savePMReport(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">انتخاب دستگاه</label>
                            <select id="pm-eq-select" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm"></select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">شرح خدمات / تعمیرات انجام شده</label>
                            <textarea id="pm-desc" rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl transition">ثبت گزارش با تاریخ و ساعت دقیق</button>
                    </form>
                </div>

                <!-- ۴. اسکنر بارکد -->
                <div id="panel-scanner" class="dashboard-panel space-y-4 hidden">
                    <h3 class="text-base font-bold text-amber-400 border-b border-slate-700 pb-2">اسکنر بارکد و QR Code</h3>
                    <div class="max-w-sm mx-auto bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
                        <div id="reader" class="w-full mb-4"></div>
                        <button onclick="startScanner()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">فعال‌سازی دوربین اسکنر</button>
                        <p id="scan-result" class="mt-3 text-xs text-slate-300"></p>
                    </div>
                </div>

                <!-- ۵. مدیریت کاربران (مخصوص مدیر) -->
                <div id="panel-users" class="dashboard-panel space-y-4 hidden">
                    <h3 class="text-base font-bold text-amber-400 border-b border-slate-700 pb-2">مدیریت دسترسی پرسنل</h3>
                    <div id="users-list-container" class="space-y-2"></div>
                </div>

            </div>
        </section>

    </main>

    <!-- فوتر با متن حقوقی دلخواه -->
    <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        تمامی حقوق این سامانه متعلق به کارخانه پارسا مهر آرین می‌باشد.
    </footer>

    <script>
        let currentUser = null;
        let equipmentData = JSON.parse(localStorage.getItem('parsa_eq') || '[]');
        let usersData = JSON.parse(localStorage.getItem('parsa_users') || '[]');
        let html5QrCode = null;

        function switchTab(role) {
            if (role === 'staff') {
                document.getElementById('staff-form').classList.remove('hidden');
                document.getElementById('manager-form').classList.add('hidden');
                document.getElementById('tab-staff-btn').className = "flex-1 pb-3 font-bold text-amber-400 border-b-2 border-amber-400 transition";
                document.getElementById('tab-manager-btn').className = "flex-1 pb-3 font-bold text-slate-400 transition";
            } else {
                document.getElementById('staff-form').classList.add('hidden');
                document.getElementById('manager-form').classList.remove('hidden');
                document.getElementById('tab-manager-btn').className = "flex-1 pb-3 font-bold text-amber-400 border-b-2 border-amber-400 transition";
                document.getElementById('tab-staff-btn').className = "flex-1 pb-3 font-bold text-slate-400 transition";
            }
        }

        function handleStaffLogin(e) {
            e.preventDefault();
            const name = document.getElementById('staff-name').value;
            const role = document.getElementById('staff-role').value;
            const phone = document.getElementById('staff-phone').value;

            let existing = usersData.find(u => u.phone === phone);
            if (!existing) {
                existing = { name, role, phone, status: 'pending' };
                usersData.push(existing);
                localStorage.setItem('parsa_users', JSON.stringify(usersData));
            }

            if (existing.status === 'blocked') {
                alert('دسترسی شما توسط مدیریت مسدود شده است.');
                return;
            }
            if (existing.status === 'pending') {
                alert('ثبت‌نام شما انجام شد. لطفاً منتظر تأیید مدیریت بمانید.');
                return;
            }

            currentUser = existing;
            enterDashboard();
        }

        function handleManagerLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('manager-pass').value;
            if (pass === '0051') {
                currentUser = { name: 'مدیر کل', role: 'مدیریت تأسیسات', type: 'manager' };
                enterDashboard();
            } else {
                alert('رمز عبور مدیریت اشتباه است.');
            }
        }

        function enterDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('header-user-info').classList.remove('hidden');
            document.getElementById('current-user-badge').innerText = `${currentUser.name} (${currentUser.role})`;
            
            if (currentUser.type === 'manager') {
                document.getElementById('manager-tab-btn').classList.remove('hidden');
                updateUsersList();
            } else {
                document.getElementById('manager-tab-btn').classList.add('hidden');
            }

            updateEquipmentList();
            updateEquipmentSelect();
        }

        function logout() {
            if (html5QrCode) {
                html5QrCode.stop().catch(err => {});
            }
            currentUser = null;
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('header-user-info').classList.add('hidden');
            document.getElementById('manager-pass').value = '';
        }

        function switchDashboardTab(tabName) {
            if (html5QrCode && tabName !== 'scanner') {
                html5QrCode.stop().catch(err => {});
            }
            document.querySelectorAll('.dashboard-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(`panel-${tabName}`).classList.remove('hidden');
        }

        function saveEquipment(e) {
            e.preventDefault();
            const name = document.getElementById('eq-name').value;
            const code = document.getElementById('eq-code').value;
            const location = document.getElementById('eq-location').value;
            const period = document.getElementById('eq-period').value;

            equipmentData.push({ name, code, location, period });
            localStorage.setItem('parsa_eq', JSON.stringify(equipmentData));
            alert('تجهیز با موفقیت ثبت شد.');
            e.target.reset();
            updateEquipmentList();
            updateEquipmentSelect();
        }

        function updateEquipmentList() {
            const container = document.getElementById('equipment-list-container');
            if (equipmentData.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">هنوز دستگاهی ثبت نشده است.</p>';
                return;
            }
            container.innerHTML = equipmentData.map(eq => `
                <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-amber-300">${eq.name}</span>
                        <span class="text-slate-400 block mt-1">موقعیت: ${eq.location} | کد: ${eq.code}</span>
                    </div>
                    <span class="bg-amber-500/10 text-amber-400 px-2 py-1 rounded">دوره: ${eq.period} روز</span>
                </div>
            `).join('');
        }

        function updateEquipmentSelect() {
            const select = document.getElementById('pm-eq-select');
            select.innerHTML = equipmentData.map(eq => `<option value="${eq.name}">${eq.name} (کد: ${eq.code})</option>`).join('');
        }

        function savePMReport(e) {
            e.preventDefault();
            const eqName = document.getElementById('pm-eq-select').value;
            const desc = document.getElementById('pm-desc').value;
            const now = new Date().toLocaleString('fa-IR');

            const notificationText = `فعالیت نت روی دستگاه «${eqName}» توسط ${currentUser.name} (${currentUser.role}) در تاریخ ${now} ثبت شد.`;
            document.getElementById('latest-notification').innerText = notificationText;

            alert('گزارش PM با موفقیت ثبت شد و نوتیفیکیشن ارسال گردید.');
            e.target.reset();
        }

        function updateUsersList() {
            const container = document.getElementById('users-list-container');
            if (usersData.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">هنوز کاربری ثبت‌نام نکرده است.</p>';
                return;
            }
            container.innerHTML = usersData.map((u, index) => `
                <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-amber-300">${u.name} (${u.role})</span>
                        <span class="text-slate-400 block mt-1">تلفن: ${u.phone} | وضعیت: <span class="${u.status === 'approved' ? 'text-emerald-400' : 'text-amber-400'}">${u.status === 'approved' ? 'تأییدشده' : 'در انتظار تأیید'}</span></span>
                    </div>
                    <div class="flex gap-2">
                        ${u.status !== 'approved' ? `<button onclick="changeUserStatus(${index}, 'approved')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded">تأیید دسترسی</button>` : `<button onclick="changeUserStatus(${index}, 'blocked')" class="bg-rose-700 hover:bg-rose-600 text-white px-3 py-1 rounded">قطع دسترسی (اخراج)</button>`}
                    </div>
                </div>
            `).join('');
        }

        function changeUserStatus(index, status) {
            usersData[index].status = status;
            localStorage.setItem('parsa_users', JSON.stringify(usersData));
            updateUsersList();
            alert('وضعیت کاربر به‌روزرسانی شد.');
        }

        function startScanner() {
            const resultContainer = document.getElementById('scan-result');
            resultContainer.innerText = "در حال راه‌اندازی دوربین...";
            
            if (html5QrCode) {
                html5QrCode.stop().catch(err => {});
            }

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    resultContainer.innerText = `نتیجه اسکن: ${decodedText}`;
                    html5QrCode.stop().catch(err => {});
                },
                (errorMessage) => {}
            ).catch(err => {
                resultContainer.innerText = "خطا در دسترسی به دوربین مرورگر.";
            });
        }
    </script>
</body>
</html>
