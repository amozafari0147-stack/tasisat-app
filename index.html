<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت تأسیسات و نگهداری (PM)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f9; }
    .card-header { background: #1b3a57; color: white; }
    .badge-high { background-color: #dc3545; }
    .badge-mid { background-color: #ffc107; color: black; }
    .badge-low { background-color: #198754; }
  </style>
</head>
<body class="p-3">
  <div class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-header text-center py-3">
        <h4 class="m-0"><i class="fa-solid fa-gears"></i> سیستم مدیریت نت و تأسیسات</h4>
        <small class="text-white-50">پارسا مهر آرین (ثبت آفلاین در حافظه گوشی)</small>
      </div>
      <div class="card-body">
        <form id="pmForm">
          <div class="mb-3">
            <label class="form-label font-weight-bold">کد / نام تجهیز:</label>
            <input type="text" id="eqName" class="form-control" placeholder="مثال: دیگ بخار، پمپ تغذیه ۱" required>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">واحد / خط:</label>
              <select id="eqSection" class="form-select">
                <option value="بویلر و تأسیسات بخار">بویلر و بخار</option>
                <option value="خط تولید شیرخشک">خط شیرخشک</option>
                <option value="سیستم تصفیه و پایپینگ">پایپینگ و تصفیه</option>
                <option value="برق و تابلوها">برق و تابلوها</option>
              </select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">اولویت اقدام:</label>
              <select id="priority" class="form-select">
                <option value="فوری / اضطراری" class="text-danger">فوری / اضطراری</option>
                <option value="سرویس دوره‌ای (PM)" selected>سرویس دوره‌ای (PM)</option>
                <option value="عادی">عادی</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">شرح خرابی یا اقدام انجام شده:</label>
            <textarea id="actionDesc" class="form-control" rows="2" placeholder="تعویض بلبرینگ، آب‌بندی، گیج فشار و..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2"><i class="fa-solid fa-floppy-disk"></i> ثبت گزارش در سیستم</button>
        </form>
      </div>
    </div>

    <h5 class="mb-3"><i class="fa-solid fa-list-check"></i> گزارش‌های ثبت شده (<span id="totalCount">0</span>)</h5>
    <div id="recordsList"></div>
  </div>

  <script>
    const form = document.getElementById('pmForm');
    const recordsList = document.getElementById('recordsList');
    const totalCount = document.getElementById('totalCount');

    let records = JSON.parse(localStorage.getItem('pm_records') || '[]');

    function render() {
      recordsList.innerHTML = '';
      totalCount.innerText = records.length;
      if(records.length === 0) {
        recordsList.innerHTML = '<div class="alert alert-secondary text-center">هنوز هیچ گزارشی ثبت نشده است.</div>';
        return;
      }
      records.forEach((r, idx) => {
        const item = document.createElement('div');
        item.className = 'card mb-2 shadow-sm border-0';
        item.innerHTML = `
          <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <strong class="text-primary">${r.name}</strong>
              <span class="badge ${r.priority.includes('فوری') ? 'badge-high' : 'badge-low'}">${r.priority}</span>
            </div>
            <small class="text-muted d-block mb-1"><i class="fa-regular fa-clock"></i> ${r.date} | ${r.section}</small>
            <p class="mb-2 text-secondary" style="font-size: 0.9rem;">${r.desc}</p>
            <button class="btn btn-outline-danger btn-sm py-0" onclick="deleteRecord(${idx})"><i class="fa-solid fa-trash"></i> حذف</button>
          </div>
        `;
        recordsList.appendChild(item);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const newRec = {
        name: document.getElementById('eqName').value,
        section: document.getElementById('eqSection').value,
        priority: document.getElementById('priority').value,
        desc: document.getElementById('actionDesc').value,
        date: new Date().toLocaleDateString('fa-IR')
      };
      records.unshift(newRec);
      localStorage.setItem('pm_records', JSON.stringify(records));
      form.reset();
      render();
    });

    window.deleteRecord = function(index) {
      if(confirm('آیا از حذف این گزارش اطمینان دارید؟')) {
        records.splice(index, 1);
        localStorage.setItem('pm_records', JSON.stringify(records));
        render();
      }
    };

    render();
  </script>
</body>
</html>
